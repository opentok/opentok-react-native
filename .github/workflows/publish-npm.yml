name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (test without publishing)'
        required: true
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Extract version from branch name
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Extract version from release-X.X.X branch name
          if [[ $BRANCH_NAME =~ ^release-(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "❌ Error: Branch must be named 'release-X.X.X'"
            exit 1
          fi
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: npm install
        
      - name: Verify version matches package.json
        run: |
          PACKAGE_VERSION=$(npm run version:local --silent)
          BRANCH_VERSION="${{ steps.version.outputs.version }}"
          
          if [ "$PACKAGE_VERSION" != "$BRANCH_VERSION" ]; then
            echo "❌ Error: Version mismatch!"
            echo "Package.json has version $PACKAGE_VERSION but branch name indicates $BRANCH_VERSION"
            exit 1
          fi
          
      - name: Check if version already published
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PUBLISHED_VERSION=$(npm run version:published --silent 2>/dev/null || echo "")
          
          if [ "$PUBLISHED_VERSION" == "$VERSION" ]; then
            echo "❌ Error: Version $VERSION is already published on NPM!"
            exit 1
          fi
        
      - name: Dry run - Verify package
        if: inputs.dry_run == true
        run: |
          echo "🔍 DRY RUN MODE"
          npm publish --dry-run
          
      - name: Publish to NPM
        if: inputs.dry_run == false
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Verify publication
        if: inputs.dry_run == false
        run: |
          sleep 10
          npm view opentok-react-native@${{ steps.version.outputs.version }} version
          
      - name: Summary
        if: always()
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
